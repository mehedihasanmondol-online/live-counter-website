<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient spanning full canvas for maskable crop -->
    <radialGradient id="bgMaskableGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141c38" />
      <stop offset="60%" stop-color="#0b0f1e" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>

    <linearGradient id="boltGradM" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#38ef7d" />
      <stop offset="70%" stop-color="#ffea00" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>

    <linearGradient id="counterGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121a2e" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <filter id="neonGlowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Safe Area Masks -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgMaskableGlow)" />

  <!-- Stadium Grid Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255, 42, 109, 0.08)" stroke-width="2" />

  <!-- Safe Inner Content (within central 80% circle) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Scoreboard Pill Backdrop -->
    <rect x="100" y="86" width="312" height="64" rx="20" fill="url(#counterGradM)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="2.5" />
    <text x="175" y="130" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="34" fill="#00f0ff" text-anchor="middle" letter-spacing="2">09</text>
    <circle cx="256" cy="112" r="4" fill="#ffc837" />
    <circle cx="256" cy="126" r="4" fill="#ffc837" />
    <text x="337" y="130" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="34" fill="#ff2a6d" text-anchor="middle" letter-spacing="2">08</text>

    <!-- Central Hero Electric Lightning Bolt -->
    <polygon points="280,165 175,305 245,305 210,435 345,280 270,280"
             fill="none" stroke="#00f0ff" stroke-width="22" stroke-linejoin="round" opacity="0.4" />
    <polygon points="285,170 180,310 250,310 215,430 345,285 275,285"
             fill="url(#boltGradM)" filter="url(#neonGlowM)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    <polygon points="280,195 208,300 258,300 236,395 322,295 270,295"
             fill="#ffffff" opacity="0.75" />

    <!-- LIVE Dot Indicator Badge -->
    <g transform="translate(256, 420)">
      <rect x="-65" y="-18" width="130" height="34" rx="17" fill="#ff2a6d" opacity="0.25" />
      <rect x="-65" y="-18" width="130" height="34" rx="17" fill="none" stroke="#ff2a6d" stroke-width="2" />
      <circle cx="-38" cy="0" r="5" fill="#ff2a6d" />
      <text x="5" y="6" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">ARENA</text>
    </g>
  </g>
</svg>
