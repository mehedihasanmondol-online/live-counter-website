<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141c38" />
      <stop offset="60%" stop-color="#0b0f1e" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#38ef7d" />
      <stop offset="70%" stop-color="#ffea00" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>

    <!-- Counter Display Gradient -->
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121a2e" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Squircle / Shield -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="8" opacity="0.85" />

  <!-- Subtle Stadium Grid Pattern / Scoreboard Lines -->
  <path d="M 60 160 L 452 160 M 60 352 L 452 352" stroke="rgba(0, 240, 255, 0.08)" stroke-width="2" stroke-dasharray="8 8" />
  <path d="M 160 60 L 160 452 M 352 60 L 352 452" stroke="rgba(0, 240, 255, 0.08)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(0, 240, 255, 0.06)" stroke-width="2" />

  <!-- Ambient Central Flare -->
  <circle cx="256" cy="245" r="90" fill="#00f0ff" opacity="0.18" filter="url(#superGlow)" />
  <circle cx="256" cy="275" r="70" fill="#ff0080" opacity="0.14" filter="url(#superGlow)" />

  <!-- Scoreboard Pill Backdrop -->
  <rect x="100" y="86" width="312" height="64" rx="20" fill="url(#counterGrad)" stroke="rgba(0, 240, 255, 0.28)" stroke-width="2" />
  
  <!-- Scoreboard Numbers (Digital Aesthetic) -->
  <text x="175" y="130" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="34" fill="#00f0ff" text-anchor="middle" letter-spacing="2">09</text>
  <circle cx="256" cy="112" r="4" fill="#ffc837" />
  <circle cx="256" cy="126" r="4" fill="#ffc837" />
  <text x="337" y="130" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="34" fill="#ff2a6d" text-anchor="middle" letter-spacing="2">08</text>

  <!-- Central Hero Electric Lightning Bolt -->
  <!-- Outer Glow Silhouette -->
  <polygon points="280,165 175,305 245,305 210,435 345,280 270,280"
           fill="none" stroke="#00f0ff" stroke-width="22" stroke-linejoin="round" opacity="0.45" filter="url(#superGlow)" />

  <!-- Main Bolt Geometry -->
  <polygon points="285,170 180,310 250,310 215,430 345,285 275,285"
           fill="url(#boltGrad)" filter="url(#neonGlow)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- Core White Highlight Stream inside Bolt -->
  <polygon points="280,195 208,300 258,300 236,395 322,295 270,295"
           fill="#ffffff" opacity="0.75" />

  <!-- LIVE Dot Indicator Badge -->
  <g transform="translate(256, 420)">
    <rect x="-65" y="-18" width="130" height="34" rx="17" fill="#ff2a6d" opacity="0.2" />
    <rect x="-65" y="-18" width="130" height="34" rx="17" fill="none" stroke="#ff2a6d" stroke-width="2" />
    <circle cx="-38" cy="0" r="5" fill="#ff2a6d" filter="url(#neonGlow)" />
    <text x="5" y="6" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">LIVE PWA</text>
  </g>
</svg>
